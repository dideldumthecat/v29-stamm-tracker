monolog:
    channels: # To see all channels, run bin/console debug:autowiring logger
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - client # Reports the app sends about itself (DiagnosticsController)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            # Tests must not grow a log file; failures show up as test failures.
            main:
                type: 'null'

when@prod:
    monolog:
        handlers:
            # Everything in one file: a line per API request, the outcomes of sync, photo upload and snapshot, and errors with
            # their stack trace. Always written; there is no buffering that could swallow lines before a crash.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: info
                max_files: 30
                channels: ["!event", "!doctrine", "!deprecation", "!client", "!request"]
            # Symfony's "request" channel logs "Matched route" at info before every request, which would double the lines.
            # From notice up (404/405, errors with stack trace) it belongs in the same file; a handler has one level only.
            request_problems:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: notice
                max_files: 30
                channels: ["request"]
            # What the app reports about itself (POST /api/diagnostics): one JSON object per line, readable with grep.
            client:
                type: rotating_file
                path: "%kernel.logs_dir%/client.log"
                level: info
                max_files: 30
                channels: ["client"]
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
