# Attributes for capture, as agreed with V29 (26.10.2026).
# Import: ddev console app:attributes:import data/attributes.yaml
# Order in this file = order in the app. Never rename an attribute or option that already has values:
# the import matches by name/label and would create a new one.

- name: Holzart
  type: choice
  is_inheritable: true
  options:
    - Traubeneiche (Quercus petraea)
    - Stieleiche (Quercus robur)
    - Roteiche (Quercus rubra)

- name: Polternummer
  type: choice
  is_inheritable: true
  options: ['01 (0101/0145)', '02', '03', '04', '05', '06', '07', '08', '09', '10']

- name: Fällzeitpunkt
  type: month
  is_inheritable: true

- name: Größter Stammdurchmesser
  type: number
  unit: cm
  is_inheritable: true

- name: Kleinster Stammdurchmesser
  type: number
  unit: cm
  is_inheritable: true

# Same value for a stem and the beams sawn lengthwise from it; set the beam's own value after a cross cut.
- name: Länge
  type: choice
  is_inheritable: true
  options: ['4,10 m', '3,60 m', '3,20 m']

- name: Gesägt
  type: boolean
  is_inheritable: true

- name: Entlastungsschnitt
  type: boolean
  is_inheritable: true

- name: Entrindet
  type: boolean
  is_inheritable: true

- name: Notiz
  type: text
  is_series: true

- name: Fotos
  type: photo
  is_series: true
