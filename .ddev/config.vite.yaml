# Vite-Port nach außen freigeben, HTTPS kommt vom DDEV-Router.
# Vite selbst wird manuell gestartet: ddev frontend run dev (App und Administration), einzeln dev:app bzw. dev:admin
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173
  - name: vite-admin
    container_port: 5174
    http_port: 5175
    https_port: 5174
