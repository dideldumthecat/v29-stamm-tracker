<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prototyp Tailwind – 01 Start</title>
<link rel="stylesheet" href="build.css">
</head>
<body>
<!-- App-Spalte: auf dem Start-Screen ein Grid aus Kopfzeile + Rest, genau eine Bildschirmhöhe -->
<div class="mx-auto grid h-screen-safe max-w-[430px] grid-rows-[auto_minmax(0,1fr)] overflow-hidden bg-paper min-[480px]:border-x min-[480px]:border-line">

  <header class="flex items-center justify-between gap-3 border-b-2 border-ink py-3 px-gutter">
    <div class="flex min-w-0 flex-col gap-0.5">
      <span class="text-[17px] font-bold">V29 Stamm-Tracker</span>
      <span class="text-xs text-mute">Zuletzt synchronisiert: 15.10., 18:42</span>
    </div>
    <div class="flex items-center gap-1.5">
      <!-- Sync-Knopf mit Zähler offener Einträge (ohne offene Einträge: Zähler weglassen) -->
      <button type="button" class="flex min-h-11 items-center gap-2 rounded-full border-2 border-ink bg-paper pr-2 pl-3.5 text-[15px] font-semibold" aria-label="Synchronisieren, 3 nicht synchronisiert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 0 1-15.5 6.2M3 12a9 9 0 0 1 15.5-6.2"/><path d="M21 4v5h-5M3 20v-5h5"/></svg>
        <span>Sync</span>
        <span class="flex h-[26px] min-w-[26px] items-center justify-center rounded-full bg-ink px-1.5 text-sm text-paper tabular-nums">3</span>
      </button>
    </div>
  </header>

  <div class="flex min-h-0 flex-col justify-end overflow-hidden pb-3">
    <section class="mb-auto flex flex-col gap-2 py-3 px-gutter">
      <span class="text-[15px] font-semibold" id="numlbl" aria-live="polite">Stammnummer</span>
      <!-- Fehlerzustand bei Nummer > 1999, ersetzt „Stammnummer“:
      <span class="block text-sm font-semibold" role="alert">Diese Nummer gibt es nicht. Plaketten gehen von 00000 bis 01999.</span>
      -->
      <div class="grid grid-cols-5 gap-2" role="status" aria-label="Stammnummer 00012">
        <!-- führende Null: hell und abgeschwächt -->
        <div class="flex h-20 items-center justify-center rounded-lg border-2 border-line bg-well text-[56px] leading-none font-bold text-faint tabular-nums opacity-40 shorter:h-[60px] shorter:text-[42px]">0</div>
        <div class="flex h-20 items-center justify-center rounded-lg border-2 border-line bg-well text-[56px] leading-none font-bold text-faint tabular-nums opacity-40 shorter:h-[60px] shorter:text-[42px]">0</div>
        <div class="flex h-20 items-center justify-center rounded-lg border-2 border-line bg-well text-[56px] leading-none font-bold text-faint tabular-nums opacity-40 shorter:h-[60px] shorter:text-[42px]">0</div>
        <!-- eingegebene Ziffer: schwarz gefüllt -->
        <div class="flex h-20 items-center justify-center rounded-lg bg-ink text-[56px] leading-none font-bold text-paper tabular-nums shorter:h-[60px] shorter:text-[42px]">1</div>
        <div class="flex h-20 items-center justify-center rounded-lg bg-ink text-[56px] leading-none font-bold text-paper tabular-nums shorter:h-[60px] shorter:text-[42px]">2</div>
      </div>
    </section>

    <div class="pb-3 px-gutter">
      <!-- disabled: solange keine gültige Nummer eingegeben ist -->
      <button type="button" class="flex h-[72px] w-full items-center justify-center gap-2.5 rounded-lg bg-ink text-lg font-bold text-paper disabled:cursor-default disabled:bg-disabled disabled:text-mute shorter:h-[60px]">Stamm öffnen</button>
    </div>

    <!-- Ziffernfeld: Zeilenhöhe wächst mit dem verfügbaren Platz zwischen 52 und 72px -->
    <div class="grid min-h-0 touch-manipulation auto-rows-[minmax(52px,72px)] grid-cols-3 content-end gap-2 select-none px-gutter" role="group" aria-labelledby="numlbl">
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">1</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">2</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">3</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">4</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">5</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">6</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">7</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">8</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">9</button>
      <!-- Funktionstasten: weißer Hintergrund, kleinere Schrift -->
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-paper text-base font-semibold active:bg-ink active:text-paper">Leeren</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-well text-3xl font-semibold active:bg-ink active:text-paper">0</button>
      <button type="button" class="flex touch-manipulation items-center justify-center rounded-[10px] border-2 border-ink bg-paper text-base font-semibold active:bg-ink active:text-paper" aria-label="Letzte Ziffer löschen">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
      </button>
    </div>
  </div>
</div>
</body>
</html>
