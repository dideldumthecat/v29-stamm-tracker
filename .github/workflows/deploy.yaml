name: Deploy

# Manual only: main receives many small commits, and every deploy runs migrations against the live database.
on:
  workflow_dispatch:

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: IONOS
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --no-scripts: the Symfony auto-scripts would clear the cache in the dev environment,
      # whose bundles are missing without dev dependencies. The cache is cleared on the server instead.
      - name: Install Composer dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-scripts --no-interaction

      # The build includes the type check and copies the app into backend/public.
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Equal identifiers across deploys = the phones get no app update.
      - name: Write build identifier to summary
        working-directory: frontend/app
        run: |
          echo "App build: \`$(node build-id.ts)\` · commit: \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare SSH
        env:
          KNOWN_HOST_KEY: ${{ secrets.KNOWN_HOST_KEY }}
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          echo "$KNOWN_HOST_KEY" > known_hosts
          chmod 644 known_hosts
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem

      # With the code that runs there now, before anything changes. A failed, empty or cut-off dump stops the deploy.
      # var/ is outside the web root and excluded from rsync, so --delete never touches the backups.
      - name: Back up the database
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          PHP_BIN: ${{ vars.PHP_BIN }}
        run: |
          NAME="db-$(TZ=Europe/Berlin date +%Y-%m-%d-%H%M%S)-before-${GITHUB_SHA::7}.sql"
          ssh -i key.pem -o UserKnownHostsFile=known_hosts "$SSH_USERNAME@$SSH_HOST" sh -s -- "$REMOTE_PATH" "$PHP_BIN" "$NAME" <<'SCRIPT'
          set -e
          cd "$1"
          mkdir -p var/backups
          FILE="var/backups/$3"
          # mysqldump ends a complete dump with this line; an empty or interrupted file lacks it
          if ! "$2" bin/console app:db:dump > "$FILE" || ! tail -n 1 "$FILE" | grep -q '^-- Dump completed'; then
            rm -f "$FILE"
            echo "Database dump failed or is incomplete; nothing was deployed." >&2
            exit 1
          fi
          gzip "$FILE"
          ls -1t var/backups/db-*.sql.gz | tail -n +11 | xargs -r rm -f --
          ls -l "$FILE.gz"
          SCRIPT
          echo "Database backup: \`var/backups/$NAME.gz\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload and migrate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          # `php` alone is PHP 4.4 on IONOS; the path depends on the contract date (php8.4-cli or php8.4).
          PHP_BIN: ${{ vars.PHP_BIN }}
        run: |
          SSH="ssh -i key.pem -o UserKnownHostsFile=known_hosts"
          # --delete keeps the server in step with the repo; .rsync-exclude protects .env.local and var/.
          rsync -avz --delete --exclude-from='.rsync-exclude' -e "$SSH" backend/ "$SSH_USERNAME@$SSH_HOST:$REMOTE_PATH/"
          $SSH "$SSH_USERNAME@$SSH_HOST" "cd $REMOTE_PATH && $PHP_BIN bin/console cache:clear && $PHP_BIN bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration"

      - name: Clean up
        if: always()
        run: rm -f key.pem known_hosts

      - name: Tag deployed commit
        run: |
          TAG="prod-$(TZ=Europe/Berlin date +%Y-%m-%d-%H%M)"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"
